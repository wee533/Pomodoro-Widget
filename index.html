<style>
  :root {
    --accent-color: #9bb09e;
    --reset-color: #f1f3f5;
    --text-main: #4a4a4a;
    --text-muted: #8c857b;
    --card-bg: #f8f6f0;
    --card-shadow: 0 10px 30px rgba(0, 0, 0, 0.12), 0 4px 10px rgba(0, 0, 0, 0.05);
  }

  /* 基础与防溢出设置 */
  *, *::before, *::after {
    box-sizing: border-box;
  }

  html, body {
    background-color: transparent !important;
    margin: 0;
    padding: 0;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    user-select: none;
    -webkit-app-region: no-drag;
  }

  /* 番茄钟卡片容器：去掉 absolute，改为居中自适应 */
  .widget-container {
    width: 310px;
    margin: 10px auto;
    background-color: var(--card-bg);
    border-radius: 20px;
    box-shadow: var(--card-shadow);
    display: flex;
    flex-direction: column;
    padding: 16px;
    border: 1px solid rgba(255, 255, 255, 0.8);
    pointer-events: auto;
  }

  /* 顶部拖拽栏 */
  .header {
    -webkit-app-region: drag; /* 开启拖拽 */
    cursor: move;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding-bottom: 12px;
  }

  .title-group {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .status-dot {
    width: 8px;
    height: 8px;
    background-color: var(--accent-color);
    border-radius: 50%;
  }

  .title-text {
    font-size: 13px;
    font-weight: 600;
    color: var(--text-main);
  }

  .collapse-btn {
    -webkit-app-region: no-drag; /* 禁用拖拽，允许点击 */
    background: none;
    border: none;
    color: var(--text-muted);
    cursor: pointer;
    font-size: 14px;
    padding: 2px 6px;
    border-radius: 6px;
  }
  .collapse-btn:hover { background-color: rgba(0,0,0,0.05); }

  /* 计时器主体 */
  .timer-body {
    background-color: #ffffff;
    border-radius: 14px;
    padding: 16px;
    text-align: center;
    border: 1px solid rgba(0,0,0,0.03);
    margin-bottom: 12px;
  }

  .timer-display {
    font-size: 48px;
    font-weight: 700;
    color: var(--text-main);
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    margin: 8px 0 16px 0;
    line-height: 1;
  }

  .controls {
    display: flex;
    justify-content: center;
    gap: 10px;
  }

  .btn {
    -webkit-app-region: no-drag;
    border: none;
    padding: 8px 20px;
    border-radius: 16px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: background-color 0.2s, transform 0.1s;
  }

  .btn-start { background-color: var(--accent-color); color: #ffffff; }
  .btn-start:hover { background-color: #889f8b; }
  .btn-start:active { transform: scale(0.98); }

  .btn-reset { background-color: var(--reset-color); color: var(--text-main); }
  .btn-reset:hover { background-color: #e2e6ea; }

  /* 待办事项 */
  .todo-section {
    position: relative;
    -webkit-app-region: no-drag;
  }

  .todo-input {
    width: 100%;
    background-color: #ffffff;
    border: 1px solid rgba(0,0,0,0.06);
    color: var(--text-main);
    padding: 10px 14px 10px 32px;
    border-radius: 10px;
    font-size: 12px;
    outline: none;
  }
  .todo-input:focus { border-color: var(--accent-color); }

  .todo-icon {
    position: absolute;
    left: 10px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--text-muted);
    font-size: 14px;
  }
</style>
